services:
  web:
    build: .
    container_name: hunter-ctf-web
    ports:
      - "30007:3001"
    volumes:
      - ./:/var/www/html/
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=hunter_association
      - DB_USER=hunter_app
      - DB_PASS=HunterApp2026!Secure

  db:
    image: mariadb:10.6
    container_name: hunter-ctf-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: hunter_association
      MYSQL_USER: hunter_app
      MYSQL_PASSWORD: HunterApp2026!Secure
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d

volumes:
  db_data:
